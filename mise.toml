[tools]
go = "1.27"
golangci-lint = "2.13.2"

[env]
# MODULES lists every module in go.work, as package patterns: ./... at the root lists only the
# root module's packages. A module that imports a workspace sibling carries no require line for
# it, so go mod tidy cannot run there; its go.mod is edited by hand.
MODULES = "./... ./courier/... ./messaging/nats/... ./messaging/postgres/... ./services/command/... ./services/exercise/... ./services/intelligence/... ./services/operations/..."
MESSAGING_DSN = "postgres://app:app@127.0.0.1:5435/app?sslmode=disable"
MESSAGING_NATS_URL = "nats://127.0.0.1:4225"

[tasks.build]
description = "Build the module"
run = "go build $MODULES"

[tasks.test]
description = "Run tests"
run = "go test -race $MODULES"

[tasks.vet]
description = "Run go vet"
run = "go vet $MODULES"

[tasks.fmt]
description = "Format all Go source"
run = "gofmt -w ."

[tasks.tidy]
description = "Tidy the root module, the one module that imports no workspace sibling"
run = "GOWORK=off go mod tidy"

[tasks.lint]
description = "Run golangci-lint, including the integration-tagged files, and sqlint in each module with SQL"
run = '''
set -e
golangci-lint run --build-tags integration $MODULES
# Each module with SQL keeps a sqlint.toml at its root.
for conf in $(git ls-files '*sqlint.toml'); do
  (cd "$(dirname "$conf")" && go tool sqlint)
done
'''

[tasks.integration]
description = "Run tests, including those against the compose stack's Postgres and NATS"
run = "go test -race -tags integration -count=1 $MODULES"

[tasks."command-serve"]
description = "Run the command service locally against the compose stack"
dir = "services/command"
env = { COMMAND_ENV = "local" }
run = "go run ./cmd/server"

[tasks."exercise-serve"]
description = "Run the exercise service locally against the compose stack"
dir = "services/exercise"
env = { EXERCISE_ENV = "local" }
run = "go run ./cmd/server"

[tasks."intelligence-serve"]
description = "Run the intelligence service locally against the compose stack"
dir = "services/intelligence"
env = { INTELLIGENCE_ENV = "local" }
run = "go run ./cmd/server"

[tasks."operations-serve"]
description = "Run the operations service locally against the compose stack"
dir = "services/operations"
env = { OPERATIONS_ENV = "local" }
run = "go run ./cmd/server"

[tasks.up]
description = "Start the compose stack and wait until it is healthy"
run = "docker compose up -d --wait"

[tasks.down]
description = "Stop the compose stack"
run = "docker compose down"

[tasks.reset]
description = "Stop the compose stack and delete its volume"
run = "docker compose down -v"

[tasks.split-check]
description = "Check that the root module reaches nothing outside the standard library, sqlate's engine-agnostic packages, and go-core, that courier's scenarios reach no NATS package, and that each service's domain reaches no messaging package or provider and no service reaches another"
run = '''
allowed='^github.com/standards-lab/(sqlate(/(header|query|sqltest|migrate))?|go-core(/.*)?)$'
# A package outside the standard library has a dot in its first path element.
# go list runs on its own first, so a package that fails to load fails the check.
deps=$(go list -deps -test -tags integration ./...) || exit 1
found=$(echo "$deps" | awk '{print $1}' | grep -E '^[^/]+\.[^/]*/' \
  | grep -v '^github.com/JaimeStill/spike-messaging' | sort -u | grep -Ev "$allowed" || true)
if [ -n "$found" ]; then
  echo "the root module reaches packages outside its allow-list:"; echo "$found"; exit 1
fi
echo "split-check: the root module reaches only the standard library, sqlate's engine-agnostic packages, and go-core"
# Evidence 8: the native request and reply stays in the nats provider and the composition root, so
# the broker-agnostic scenarios reach neither nats.go nor the provider.
deps=$(go list -deps -test -tags integration ./courier/scenario/...) || exit 1
found=$(echo "$deps" | awk '{print $1}' \
  | grep -E '^(github.com/nats-io/|github.com/JaimeStill/spike-messaging/messaging/nats(/|$))' | sort -u || true)
if [ -n "$found" ]; then
  echo "courier/scenario reaches NATS packages:"; echo "$found"; exit 1
fi
echo "split-check: courier/scenario reaches neither nats.go nor the nats provider"
# Evidence 6: of the spike's packages, a service's domain and data packages reach only core and
# their own module, so they reach no messaging package or provider; the rest of the service is its
# composition root. The first check leaves their tests out, because an integration test composes
# the sink it records through. The second check covers every package of a service, tests included,
# and finds none that reaches another service.
for dir in services/*/; do
  svc=$(basename "$dir")
  mod="github.com/JaimeStill/spike-messaging/services/$svc"
  deps=$(cd "$dir" && go list -deps ./domain/... ./data/...) || exit 1
  found=$(echo "$deps" | awk '{print $1}' | grep '^github.com/JaimeStill/spike-messaging/' \
    | grep -Ev "^(github.com/JaimeStill/spike-messaging/core/|$mod(/|$))" | sort -u || true)
  if [ -n "$found" ]; then
    echo "$svc's domain reaches spike packages outside core:"; echo "$found"; exit 1
  fi
  # Nor does it reach a provider outside the spike: the NATS client, a Postgres driver, or an
  # engine's own packages.
  found=$(echo "$deps" | awk '{print $1}' \
    | grep -E '^(github.com/nats-io/|github.com/jackc/|github.com/standards-lab/sqlate/postgres(/|$)|github.com/standards-lab/go-database(/|$))' \
    | sort -u || true)
  if [ -n "$found" ]; then
    echo "$svc's domain reaches a provider:"; echo "$found"; exit 1
  fi
  deps=$(cd "$dir" && go list -deps -test -tags integration ./...) || exit 1
  found=$(echo "$deps" | awk '{print $1}' | grep '^github.com/JaimeStill/spike-messaging/services/' \
    | grep -Ev "^$mod(/|$)" | sort -u || true)
  if [ -n "$found" ]; then
    echo "$svc reaches another service:"; echo "$found"; exit 1
  fi
done
echo "split-check: each service's domain reaches no messaging package or provider, and no service reaches another"
'''

[tasks."demo-theater"]
description = "Play a skirmish on the running services and narrate it: SEED replays a seed, and FIXTURE names another fixture"
run = '''
set -eu
fixture="services/exercise/fixtures/${FIXTURE:-skirmish}.json"
[ -f "$fixture" ] || { echo "no fixture at $fixture"; exit 1; }
for port in 8081 8082 8083 8084; do
  curl -sf -o /dev/null "localhost:$port/readyz" || { echo "no service is ready on :$port; run exercise-serve, intelligence-serve, command-serve, and operations-serve first"; exit 1; }
done
out=$(mktemp -d)
go build -o "$out/courier" ./courier/cmd/courier
# SEED replays a skirmish; without it, exercise draws a seed, and the narration shows it.
body=$(jq -c --argjson seed "${SEED:-null}" 'if $seed == null then . else . + {seed: $seed} end' "$fixture")
id=$(curl -sf -XPOST localhost:8081/api/exercises -d "$body" | jq -r .id)
# The narration joins the stream before the start, so it reads from round 0.
"$out/courier" --broker nats scenario theater --exercise "$id" --wait 5m &
narration=$!
sleep 2
curl -sf -o /dev/null -XPOST "localhost:8081/api/exercises/$id/start"
wait "$narration"
'''

[tasks."demo-theater-check"]
description = "Reconcile a theater run's assessments against the observer's record: the latest run, or the exercise ID given"
usage = 'arg "[id]" help="the exercise to check (default: the latest)"'
run = '''
set -eu
# exercise's API lists no exercises, so the latest is read from its database.
id=${usage_id:-$(docker compose exec -T postgres psql -U app -d exercise -Atc "select id from exercise order by created_at desc limit 1")}
[ -n "$id" ] || { echo "no exercise found; run mise run demo-theater first"; exit 1; }
out=$(mktemp -d)
go build -o "$out/courier" ./courier/cmd/courier
"$out/courier" --broker nats scenario theater-check --exercise "$id"
'''

[tasks."validate-replicas"]
description = "Reset the compose stack, deleting its volumes, then run two operations replicas in one delivery group, stop one mid-exercise, and check that it drains and the other carries both factions: SEED replays a seed (default 7)"
run = "bash scripts/validate/replicas.sh"

[tasks."validate-outages"]
description = "Reset the compose stack, deleting its volumes, then stop each service and NATS in turn mid-exercise, and check that the others keep serving and the exercise converges: TARGETS names a subset, and SEED replays a seed (default 7)"
run = "bash scripts/validate/outages.sh"
