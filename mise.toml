[tools]
go = "1.27"
golangci-lint = "2.13.2"

[env]
MESSAGING_DSN = "postgres://app:app@127.0.0.1:5435/app?sslmode=disable"

[tasks.build]
description = "Build the module"
run = "go build ./..."

[tasks.test]
description = "Run tests"
run = "go test -race ./..."

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.fmt]
description = "Format all Go source"
run = "gofmt -w ."

[tasks.tidy]
description = "Run go mod tidy"
run = "go mod tidy"

[tasks.lint]
description = "Run golangci-lint, including the integration-tagged files, and sqlint"
run = "golangci-lint run --build-tags integration ./... && go tool sqlint"

[tasks.integration]
description = "Run tests, including those against the compose stack's Postgres"
run = "go test -race -tags integration -count=1 ./..."

[tasks.up]
description = "Start the compose stack and wait until it is healthy"
run = "docker compose up -d --wait"

[tasks.down]
description = "Stop the compose stack"
run = "docker compose down"

[tasks.reset]
description = "Stop the compose stack and delete its volume"
run = "docker compose down -v"
