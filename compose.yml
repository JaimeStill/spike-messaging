# This stack runs the spike's Postgres, for messaging/outbox's integration
# tests and courier's outbox scenario, and the spike's NATS server with
# JetStream, for messaging/nats's integration tests and courier's nats
# broker. Port 5435 lets Postgres run beside sqlate (5433), spike-blobfs
# (5434), and go-web-service (5432); port 4225 keeps NATS off the default
# 4222 that signal-lab uses.
services:
  postgres:
    image: postgres:18-alpine
    container_name: messaging-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - messaging-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.15-alpine
    container_name: messaging-nats
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:${NATS_PORT:-4225}:4222"
    volumes:
      - messaging-nats:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:8222/healthz?js-enabled-only=true'"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  messaging-postgres:
  messaging-nats:
